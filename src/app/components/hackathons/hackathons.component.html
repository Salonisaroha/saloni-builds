<section id="hackathons" class="hackathons">
  <div class="container">
    <h2 class="section-title" [@fadeInUp]>
      <span class="title-number">04.</span>
      Hackathons & Events
    </h2>
    
    <div class="events-grid">
      <div *ngFor="let event of hackathonEvents" class="event-card" [@fadeInUp]>
        <h3 class="event-name">{{ event.name }}</h3>
        <div class="images-preview">
          <div 
            *ngFor="let image of event.images; let i = index" 
            class="image-thumb"
            (click)="openLightbox(event.images, i)">
            <img [src]="image" [alt]="event.name" loading="lazy">
            <div class="image-overlay">
              <span class="view-icon">👁️</span>
            </div>
          </div>
          <div *ngIf="event.images.length > 3" class="more-images" (click)="openLightbox(event.images)">
            <span>+{{ event.images.length - 3 }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div *ngIf="showLightbox" class="lightbox" (click)="closeLightbox()">
    <div class="lightbox-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeLightbox()">&times;</button>
      <button *ngIf="selectedImages.length > 1" class="nav-btn prev" (click)="prevImage()">‹</button>
      <img [src]="selectedImages[currentImageIndex]" alt="Hackathon Image">
      <button *ngIf="selectedImages.length > 1" class="nav-btn next" (click)="nextImage()">›</button>
      <div class="image-counter">{{ currentImageIndex + 1 }} / {{ selectedImages.length }}</div>
    </div>
  </div>
</section>
